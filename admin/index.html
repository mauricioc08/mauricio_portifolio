<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin · mauricio.dev</title>
    <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
    <script type="module" src="../assets/js/admin.js"></script>
  </head>
  <body class="admin">
    <!-- estado: Firebase não configurado -->
    <section id="admin-disabled" class="admin-center" hidden>
      <div class="glass admin-card">
        <h1>Admin indisponível</h1>
        <p>
          O Firebase ainda não foi configurado. Preencha
          <code>assets/js/firebase/config.js</code> seguindo o
          <code>FIREBASE_SETUP.md</code> e recarregue esta página.
        </p>
      </div>
    </section>

    <!-- estado: login -->
    <section id="admin-login" class="admin-center" hidden>
      <form class="glass admin-card" id="login-form">
        <a class="brand" href="../index.html">mauricio<b>.dev</b></a>
        <h1>Painel de administração</h1>
        <label>
          E-mail
          <input type="email" id="login-email" autocomplete="username" required />
        </label>
        <label>
          Senha
          <input type="password" id="login-password" autocomplete="current-password" required />
        </label>
        <p class="admin-error" id="login-error" hidden></p>
        <button class="btn btn--primary" type="submit" id="login-submit">Entrar</button>
        <a class="admin-link" href="../index.html">← Voltar ao site</a>
      </form>
    </section>

    <!-- estado: painel -->
    <div id="admin-app" hidden>
      <header class="admin-header">
        <a class="brand" href="../index.html">mauricio<b>.dev</b> <span>admin</span></a>
        <nav class="admin-tabs" id="admin-tabs">
          <button class="admin-tab active" data-tab="projects">Projetos</button>
          <button class="admin-tab" data-tab="experience">Experiência</button>
          <button class="admin-tab" data-tab="content">Textos</button>
        </nav>
        <div class="admin-header-actions">
          <a class="btn btn--ghost" href="../index.html" target="_blank" rel="noopener">Ver site</a>
          <button class="btn" id="logout-btn">Sair</button>
        </div>
      </header>

      <main class="admin-main">
        <div id="admin-toast" class="admin-toast" hidden></div>

        <!-- PROJETOS -->
        <section class="admin-panel" data-panel="projects">
          <div class="admin-panel-head">
            <h2>Projetos</h2>
            <button class="btn btn--primary" id="add-project">+ Novo projeto</button>
          </div>
          <div class="admin-list" id="projects-list"></div>
        </section>

        <!-- EXPERIÊNCIA -->
        <section class="admin-panel" data-panel="experience" hidden>
          <div class="admin-panel-head">
            <h2>Experiência</h2>
            <button class="btn btn--primary" id="add-experience">+ Nova experiência</button>
          </div>
          <div class="admin-list" id="experience-list"></div>
        </section>

        <!-- TEXTOS -->
        <section class="admin-panel" data-panel="content" hidden>
          <div class="admin-panel-head">
            <h2>Textos das seções</h2>
            <button class="btn btn--primary" id="save-content">Salvar textos</button>
          </div>
          <div class="admin-form" id="content-form"></div>
        </section>
      </main>
    </div>

    <!-- modal de edição (projetos / experiência) -->
    <div class="admin-modal" id="admin-modal" hidden>
      <div class="admin-modal-backdrop" data-close></div>
      <form class="glass admin-modal-card" id="modal-form">
        <div class="admin-modal-head">
          <h3 id="modal-title">Editar</h3>
          <button type="button" class="admin-icon-x" data-close aria-label="Fechar">✕</button>
        </div>
        <div class="admin-modal-body" id="modal-body"></div>
        <div class="admin-modal-foot">
          <button type="button" class="btn" data-close>Cancelar</button>
          <button type="submit" class="btn btn--primary" id="modal-save">Salvar</button>
        </div>
      </form>
    </div>
  </body>
</html>
